<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GreenPlan</title>
    <meta name="description" content="Automatic urban greening placement from CAD drawings" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0f14" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // Apply persisted theme before first paint (light is the default).
      try {
        if (localStorage.getItem("greenplan.theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) { /* storage unavailable — stay light */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
