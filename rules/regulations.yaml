# ----------------------------------------------------------------------------
# Spatial rules. severity: hard  → violation invalidates a placement.
#                 severity: recommended → affects scoring / warnings only.
# role: regulatory       → правовая норма (участвует в regulatory-вердикте)
#       safe_buffer      → консервативный технологический отступ, НЕ норматив
#       design_heuristic → проектная эвристика; нарушения = warnings
# condition: { crown_diameter_max_m: 5.0 } — применимость СП 42 табл. 9.1
#   ограничена деревьями с кроной ≤ 5 м; для больших крон проверка UNVERIFIED.
# ----------------------------------------------------------------------------
