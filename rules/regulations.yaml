      clause: приложение, п. «а»
      title: "Охранная зона воздушной линии электропередачи до 1 кВ (дерево)"
      url: dataset/госты/160-ПП.pdf#page=13
      excerpt: 'Охранные зоны устанавливаются: а) вдоль воздушных линий электропередачи - … ограниченной параллельными вертикальными плоскостями, отстоящими по обе стороны линии электропередачи от крайних проводов при неотклоненном их положении на следующем расстоянии: … до 1 — 2 (для линий с самонесущими или изолированными проводами, проложенных по стенам зданий, конструкциям и т.д., охранная зона определяется в соответствии с установленными нормативными правовыми актами минимальными допустимыми расстояниями от таких линий); 1-20 — 10'
    also_cited:
      - document: pp_rf_160_2009
        clause: Правила, п. 11 «з»
        url: dataset/госты/160-ПП.pdf#page=9
        excerpt: '11. В пределах охранной зоны без соблюдения условий осуществления соответствующих видов деятельности, предусмотренных решением о согласовании такой охранной зоны, юридическим и физическим лицам запрещаются: … з) посадка и вырубка деревьев и кустарников.'
        relation: reference
    status: verified
    severity: hard
    role: regulatory
    note: "Класс напряжения в чертеже не указан. Знаки слоя «ЛЭП» топоплана стоят у опор наружного освещения — принята линия до 1 кВ (зона 2 м); для 1–20 кВ зона 10 м, 35 кВ — 15 м, 110 кВ — 20 м. Провод между опорами не нарисован: зона строится вдоль пролётов, соединяющих соседние знаки. Посадка в зоне — только на условиях решения о согласовании охранной зоны (п. 11 «з»)."

