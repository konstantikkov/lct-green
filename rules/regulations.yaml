      excerpt: 'Охранные зоны устанавливаются: а) вдоль воздушных линий электропередачи - … ограниченной параллельными вертикальными плоскостями, отстоящими по обе стороны линии электропередачи от крайних проводов при неотклоненном их положении на следующем расстоянии: … до 1 — 2 (для линий с самонесущими или изолированными проводами, проложенных по стенам зданий, конструкциям и т.д., охранная зона определяется в соответствии с установленными нормативными правовыми актами минимальными допустимыми расстояниями от таких линий); 1-20 — 10'
    also_cited:
      - document: pp_rf_160_2009
        clause: Правила, п. 11 «з»
        url: dataset/госты/160-ПП.pdf#page=9
        excerpt: '11. В пределах охранной зоны без соблюдения условий осуществления соответствующих видов деятельности, предусмотренных решением о согласовании такой охранной зоны, юридическим и физическим лицам запрещаются: … з) посадка и вырубка деревьев и кустарников.'
        relation: reference
    status: verified
    severity: hard
    role: regulatory
    note: "Класс напряжения в чертеже не указан. Знаки слоя «ЛЭП» топоплана стоят у опор наружного освещения — принята линия до 1 кВ (зона 2 м); для 1–20 кВ зона 10 м, 35 кВ — 15 м, 110 кВ — 20 м. Провод между опорами не нарисован: зона строится вдоль пролётов, соединяющих соседние знаки. Посадка в зоне — только на условиях решения о согласовании охранной зоны (п. 11 «з»)."

  - id: LAWN_RECOMMENDATION
    enabled: true
    applies_to: {planting_type: [LAWN], obstacle_type: []}
    constraint: {type: lawn_area, min_width_m: 1.0, units: m}
    source:
      document: ppm_743_2002
      clause: п. 3.8.1, 3.8.2
      title: "Устройство газона"
      url: dataset/госты/743-ПП.pdf#page=40
      excerpt: '3.8.1. Газоны следует устраивать на полностью подготовленном и спланированном основании из многокомпонентного искусственного почвогрунта заводского изготовления с соблюдением уклона основания … Уклон газона, обеспечивающий сток поверхностных вод, должен составлять 2-3 градуса. … 3.8.2. Толщина плодородного слоя принимается для обыкновенного и партерного газонов - 20 см'
    also_cited:
      - document: sp_42_13330_2016
        clause: п. 9.6
        url: dataset/госты/Приказ Минстроя РФ от 30.12.2016 N 1034ПР Об утверждении СП 42.13330 СНиП 2.07.01-89.pdf#page=51
        excerpt: '9.6 Расстояние от зданий и сооружений, а также объектов инженерного благоустройства до деревьев и кустарников принимают в соответствии с таблицей 9.1.'
        relation: reference
      - document: pp_rf_160_2009
        clause: Правила, п. 11 «д», «з»
        url: dataset/госты/160-ПП.pdf#page=9
        excerpt: 'д) земляные работы на глубине более 0,3 метра (на вспахиваемых землях на глубине более 0,45 метра), а также планировка грунта (в охранных зонах подземных кабельных линий электропередачи); … з) посадка и вырубка деревьев и кустарников.'
        relation: reference
    status: verified
    severity: recommended
    role: regulatory
    note: "Газон рекомендуется на всей области озеленения без твёрдых покрытий и кустарниковых групп; полосы уже 1 м отбрасываются (min_width_m — проектный параметр). Отступы табл. 9.1 СП 42 и ограничения охранных зон ПП РФ № 160 относятся к деревьям и кустарникам и газон не ограничивают; плодородный слой 20 см (743-ПП п. 3.8.2) мельче 0,3 м — предела земляных работ в охранной зоне кабеля (ПП РФ № 160 п. 11 «д»)."

