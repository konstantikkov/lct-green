# SOURCE OF TRUTH POLICY
#   The provided registry (fixtures/normative_acts_registry.pdf) lists the
#   applicable documents but NOT their numeric clauses. Per project policy we
#   NEVER invent regulatory values:
#     * constraint.distance_m == null  +  status: missing_source_data
#       → the rule is NOT a verified regulatory constraint.
#     * assumption: { assumed_distance_m, enabled }  → an explicitly-flagged,
#       user-configurable DEMO value. It is enforced only while enabled and is
#       always labeled "ASSUMED" in the API/UI/report, never as a legal value.
#   When a verified clause value is obtained (document text + clause + excerpt),
#   fill constraint.distance_m, set status: verified and add source.clause /
#   source.url / source.excerpt. No code changes are required.
# ============================================================================
# VERIFICATION LOG
#   2026-09-26 — СП 42.13330.2016, п. 9.6, таблица 9.1 verified against the
#   primary document text (dataset/госты/Приказ Минстроя РФ от 30.12.2016
#   N 1034ПР ... СП 42.13330 СНиП 2.07.01-89.pdf, pages 51-53; text layer
#   present, no OCR). All 12 table rows transcribed; every value below carries
#   the literal excerpt it came from. Table redaction: Изменение N 3, утв.
#   Приказом Минстроя РФ от 09.06.2022 N 473/пр.
#
#   2026-09-26 — ППМ № 369-ПП, приложение 1 verified against the primary
#   document text (dataset/госты/О мерах по регулированию ... 369-ПП.pdf,
#   pages 4-5). Full list of 31 invasive taxa transcribed into
#   INVASIVE_SPECIES_BLACKLIST.
#
#   2026-09-27 — ППМ № 743-ПП п. 3.6.3 табл. 3.6.1 and п. 3.6.4 табл. 3.6.2,
#   ППМ № 623-ПП (МГСН 1.02-02) пп. 4.2.4, 4.2.8, 4.8.14, 9.4.2 verified
#   against the primary texts (dataset/госты/743-ПП.pdf, 623-ПП.pdf; text
#   layer present, no OCR). Табл. 3.6.1 repeats СП 42 табл. 9.1 row for row
#   (values equal — asserted at build time) and adds school/kindergarten
#   10,0 м; it is recorded per rule as also_cited. 623-ПП п. 4.2.4 refers
#   to табл. 7.6 МГСН 1.01-99, which 743-ПП табл. 3.6.1 reproduces.
#   No 743-ПП clause sets a distance from a new planting to an EXISTING tree —
#   TREE_EXISTING_TREE_MIN_DISTANCE is now a safe_buffer, not a citation.
#
#   2026-09-29 — ПП РФ № 160 (Правила установления охранных зон объектов
#   электросетевого хозяйства) п. 11 «з» and приложение пп. «а», «б» verified
#   against the primary text (dataset/госты/160-ПП.pdf, pages 9 and 13; text
#   layer present; ИС «Кодекс», ред. от 30.12.2024). Planting inside a
#   protection zone is prohibited without the conditions of the zone's
#   approval decision. The line voltage is not stated in the drawings; the
#   «ЛЭП» symbols of the Mosgeotrest survey plans stand at the street
#   lighting supports, so the overhead-line rules take the «до 1» row (2 м)
#   and carry condition.voltage_class_kv — their checks stay UNVERIFIED.
#
#   2026-09-29 — lawns (ТЗ §2 п. 3): ППМ № 743-ПП п. 3.8.1-3.8.2 (page 40)
#   verified for LAWN_RECOMMENDATION; СП 42 п. 9.6 (page 51) and ПП РФ № 160
#   п. 11 «д», «з» cited to show that the distance norms and protection zones
#   concern trees and shrubs, not a lawn.
#
#   NOT verified (documents absent from dataset/госты/ or clause not located):
#     СП 59.13330 (МГН clearance), ограждение, generic utility buffer.
#     These stay on flagged DEMO values or safe buffers.
#
#   NOT MODELLED — table 9.1 rows whose obstacle category does not exist in
#   models/ir.py Category yet. Recorded with full citation, enabled: false,
#   so the registry is normatively complete without pretending to enforce:
#     трамвайное полотно, подошва откоса, ЛКС ТМК.
#   2026-10-20 — подпорная стенка modelled (RETAINING_WALL), tree 3,0 / shrub
#   1,0 enabled; TREE_OVER_UNDERGROUND_PARKING added as a project decision
#   (outside_area, safe_buffer): no trees over an underground car park slab.
#   2026-09-27 — merged onto Iteration 5: base structure (role, condition,
#   VISIBILITY_TRIANGLE_NO_TALL_PLANTS) kept from Iteration 5; the table 9.1
#   note-1 crown limit is expressed as condition.crown_diameter_max_m.
# ----------------------------------------------------------------------------
