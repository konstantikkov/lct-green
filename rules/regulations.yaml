      url: dataset/госты/О мерах по регулированию распространения и численности инвазивных растений на территории города Москвы от 03 марта 2026 - docs.cntd.ru.pdf#page=4
      excerpt: 'Перечень инвазивных видов растений, в отношении которых применяются меры по регулированию распространения и численности: 1. группа I — Айлант высочайший Ailanthus altissima (Mill.) Swingle; Борщевик Сосновского Heracleum sosnowskyi Manden; Золотарники канадский и гигантский Solidago canadensis, gigantea; Люпин многолистный Lupinus polyphyllus Lindl.; Рейнутрия Reynoutria ssp. 2. группа II — Клен ясенелистный Acer negundo L. ...'
