      title: "Охранная зона подземной кабельной линии электропередачи (кустарник)"
      url: dataset/госты/160-ПП.pdf#page=13
      excerpt: 'б) вдоль подземных кабельных линий электропередачи - … ограниченной параллельными вертикальными плоскостями, отстоящими по обе стороны линии электропередачи от крайних кабелей на расстоянии 1 метра (при прохождении кабельных линий напряжением до 1 киловольта в городах под тротуарами - на 0,6 метра в сторону зданий и сооружений и на 1 метр в сторону проезжей части улицы)'
    also_cited:
      - document: pp_rf_160_2009
        clause: Правила, п. 11 «з»
        url: dataset/госты/160-ПП.pdf#page=9
        excerpt: '11. В пределах охранной зоны без соблюдения условий осуществления соответствующих видов деятельности, предусмотренных решением о согласовании такой охранной зоны, юридическим и физическим лицам запрещаются: … з) посадка и вырубка деревьев и кустарников.'
        relation: reference
    status: verified
    severity: hard
    role: regulatory
    note: "Строже СП 42 табл. 9.1 для кустарника (0,7 м). Принят 1 м в обе стороны; уменьшение до 0,6 м для кабелей до 1 кВ под тротуарами не применяется (в безопасную сторону). Для деревьев действует СП 42 — 2,0 м."

