# ----------------------------------------------------------------------------
# Spatial rules. severity: hard  → violation invalidates a placement.
#                 severity: recommended → affects scoring / warnings only.
# role: regulatory       → правовая норма (участвует в regulatory-вердикте)
#       safe_buffer      → консервативный технологический отступ, НЕ норматив
#       design_heuristic → проектная эвристика; нарушения = warnings
# condition: { crown_diameter_max_m: 5.0 } — применимость СП 42 табл. 9.1
#   ограничена деревьями с кроной ≤ 5 м; для больших крон проверка UNVERIFIED.
# ----------------------------------------------------------------------------
rules:
  - id: TREE_BUILDING_MIN_DISTANCE
    enabled: true
    applies_to: {planting_type: [TREE], obstacle_type: [BUILDING]}
    constraint: {type: min_distance, distance_m: 5.0, units: m}
    condition: {crown_diameter_max_m: 5.0}
    source:
      document: sp_42_13330_2016
      clause: п. 9.6, таблица 9.1
      title: "Расстояние от наружной стены здания до оси ствола дерева"
      url: dataset/госты/Приказ Минстроя РФ от 30.12.2016 N 1034ПР Об утверждении СП 42.13330 СНиП 2.07.01-89.pdf#page=51
      excerpt: Наружная стена здания и сооружения — 5,0 (до оси ствола дерева)
    also_cited:
      - document: ppm_743_2002
        clause: п. 3.6.3, таблица 3.6.1
        url: dataset/госты/743-ПП.pdf#page=28
        excerpt: Наружная стена здания и сооружения — 5,0 (дерево) / 1,5 (кустарник)
        relation: same_value
      - document: ppm_623
        clause: п. 4.2.4
        url: dataset/госты/623-ПП.pdf#page=10
        excerpt: '4.2.4. При проектировании озеленения следует обеспечивать: минимальные расстояния посадок деревьев и кустарников до инженерных сетей, зданий и сооружений (табл. 7.6 МГСН 1.01-99)'
        relation: reference
    status: verified
    severity: hard
    role: regulatory
    note: "табл. 9.1 применима к деревьям с кроной ≤5 м; для больших крон расстояние должно быть увеличено"
    assumption:
      assumed_distance_m: 5.0
      enabled: false
      note: "Заменено верифицированным значением первоисточника (см. source.excerpt)."

